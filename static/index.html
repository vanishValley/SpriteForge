<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D 游戏素材生成器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  height: 100vh;
  overflow: hidden;
}

/* 布局 */
.app {
  display: grid;
  grid-template-columns: 320px 1fr 280px;
  grid-template-rows: 52px 1fr;
  height: 100vh;
}

/* 顶栏 */
.header {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
  border-bottom: 1px solid #21262d;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 10px;
}
.header .logo {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.header h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: #f0f6fc;
}
.header .badge {
  font-size: 10px;
  background: #1f2937;
  color: #8b949e;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

/* 左侧面板 */
.left-panel {
  background: #0d1117;
  border-right: 1px solid #21262d;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel-section {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 10px;
  padding: 14px;
}
.panel-section-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #7c3aed;
  margin-bottom: 10px;
}

/* 表单 */
label {
  font-size: 11px;
  font-weight: 500;
  color: #8b949e;
  display: block;
  margin-bottom: 5px;
}
label .hint { color: #484f58; font-weight: 400; }

input[type="file"] {
  width: 100%;
  padding: 8px;
  background: #0d1117;
  border: 1px dashed #30363d;
  border-radius: 8px;
  color: #8b949e;
  font-size: 12px;
  cursor: pointer;
  transition: border-color .2s;
}
input[type="file"]:hover { border-color: #7c3aed; }

input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  padding: 9px 12px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  color: #c9d1d9;
  font-size: 13px;
  font-family: inherit;
  transition: all .2s;
}
select { cursor: pointer; }
textarea { resize: vertical; min-height: 52px; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #7c3aed;
  box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
}

/* 素材类型选择 */
.type-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.type-btn {
  padding: 10px 6px;
  background: #0d1117;
  border: 1.5px solid #21262d;
  border-radius: 8px;
  color: #8b949e;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
}
.type-btn:hover { border-color: #30363d; color: #c9d1d9; }
.type-btn.active {
  border-color: #7c3aed;
  background: rgba(124, 58, 237, 0.1);
  color: #a855f7;
}

/* 按钮 */
.btn {
  padding: 11px 20px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
  color: #fff;
  width: 100%;
  box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
}
.btn-primary:hover { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); transform: translateY(-1px); }
.btn-primary:disabled { background: #21262d; color: #484f58; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-sm { padding: 6px 14px; font-size: 11px; border-radius: 6px; }
.btn-outline { background: transparent; border: 1px solid #30363d; color: #8b949e; }
.btn-outline:hover { border-color: #7c3aed; color: #c9d1d9; }

/* 参数区 */
.param-row { display: flex; gap: 8px; }
.param-row > div { flex: 1; }

.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8b949e; }
.checkbox-row input[type="checkbox"] { accent-color: #7c3aed; }

/* 中央预览区 */
.center-panel {
  background: #0d1117;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  /* 网格背景 */
  background-image:
    linear-gradient(rgba(48, 54, 61, 0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(48, 54, 61, 0.15) 1px, transparent 1px);
  background-size: 32px 32px;
}
.preview-empty {
  text-align: center;
  color: #30363d;
}
.preview-empty .icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.preview-empty p { font-size: 13px; color: #484f58; }

#preview-image {
  max-width: 90%;
  max-height: 55vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.preview-container {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

/* 动画播放器 */
.anim-bar {
  display: flex;
  gap: 6px;
  align-items: center;
  background: rgba(22, 27, 34, 0.95);
  border: 1px solid #21262d;
  padding: 8px 16px;
  border-radius: 24px;
  backdrop-filter: blur(8px);
}
.anim-bar button {
  background: none;
  border: 1px solid #30363d;
  color: #c9d1d9;
  cursor: pointer;
  font-size: 12px;
  width: 32px; height: 32px;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.anim-bar button:hover { background: #21262d; border-color: #7c3aed; }
.anim-bar input[type="range"] { width: 70px; accent-color: #7c3aed; }
.anim-bar .fps { font-size: 10px; color: #484f58; width: 36px; text-align: center; }
.anim-bar .divider { width: 1px; height: 16px; background: #21262d; }

/* 右侧面板 */
.right-panel {
  background: #0d1117;
  border-left: 1px solid #21262d;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.right-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.right-header h3 { font-size: 13px; font-weight: 600; color: #f0f6fc; }

/* 资产卡片 */
.asset-card {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 10px;
  padding: 12px;
  transition: all .2s;
  font-size: 12px;
}
.asset-card:hover { border-color: #30363d; }
.asset-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.asset-card .type-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tag-character { background: rgba(124,58,237,0.2); color: #a855f7; }
.tag-tilemap  { background: rgba(59,130,246,0.2); color: #60a5fa; }
.tag-ui       { background: rgba(16,185,129,0.2); color: #34d399; }
.tag-props    { background: rgba(245,158,11,0.2); color: #fbbf24; }
.tag-vfx      { background: rgba(239,68,68,0.2); color: #f87171; }
.asset-card .cache-tag {
  font-size: 9px;
  background: rgba(52,211,153,0.15);
  color: #34d399;
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 500;
}
.asset-card .desc-text {
  color: #8b949e;
  font-size: 12px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.asset-card .meta { color: #484f58; font-size: 10px; }
.asset-card .card-actions { display: flex; gap: 6px; margin-top: 8px; }

/* 状态条 */
.status-toast {
  position: absolute;
  top: 16px; right: 16px;
  font-size: 12px; font-weight: 500;
  padding: 8px 16px; border-radius: 20px;
  z-index: 20;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } }
.status-toast.generating { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.status-toast.done { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
.status-toast.error { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

.hidden { display: none !important; }

/* Toast 提示 */
.toast-popup {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1f2937;
  color: #f0f6fc;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  z-index: 100;
  border: 1px solid #374151;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  animation: toastIn 2.5s ease forwards;
}
@keyframes toastIn { 0%,100% { opacity: 0; transform: translateX(-50%) translateY(8px); } 15%,85% { opacity: 1; transform: translateX(-50%) translateY(0); } }

.empty-state { color: #30363d; font-size: 12px; text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <div class="header">
    <div class="logo">&#9654;</div>
    <h1>2D 游戏素材生成器</h1>
    <span class="badge">Beta</span>
  </div>

  <!-- 左侧输入面板 -->
  <div class="left-panel">
    <div class="panel-section">
      <div class="panel-section-title">风格参考</div>
      <label>上传参考图 <span class="hint">(可选)</span></label>
      <input type="file" id="style-ref-input" accept="image/*">
    </div>

    <div class="panel-section">
      <div class="panel-section-title">素材类型</div>
      <div class="type-grid" id="type-grid">
        <button class="type-btn active" data-type="character">角色</button>
        <button class="type-btn" data-type="tilemap">场景</button>
        <button class="type-btn" data-type="ui">UI</button>
        <button class="type-btn" data-type="props">道具</button>
        <button class="type-btn" data-type="vfx">特效</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">快速开始</div>
      <label>预设模板</label>
      <select id="preset-select"><option value="">-- 选择一个预设 --</option></select>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">描述与参数</div>
      <label>描述你的需求</label>
      <textarea id="desc-input" placeholder="例如：一把散发蓝光的骑士长剑，像素风格..."></textarea>

      <div class="param-row" style="margin-top:10px;">
        <div><label>尺寸</label><select id="size-input"><option value="1024*1024">1024x1024</option><option value="720*1280">720x1280</option><option value="1280*720">1280x720</option><option value="768*1152">768x1152</option></select></div>
        <div><label>帧数</label><input type="number" id="frames-input" value="1" min="1" max="16"></div>
      </div>
      <div class="param-row">
        <div><label>视角</label><select id="view-input"><option value="front">正面</option><option value="side">侧面</option><option value="top_down">俯视</option></select></div>
        <div><label>网格</label><input type="number" id="grid-input" value="32" min="16" max="128" step="16"></div>
      </div>

      <div class="checkbox-row" style="margin-top:10px;">
        <input type="checkbox" id="ai-rewrite-check" checked>
        <label for="ai-rewrite-check" style="margin:0;cursor:pointer;">AI 智能优化提示词 (DeepSeek)</label>
      </div>
    </div>

    <button class="btn btn-primary" id="generate-btn">&#9654; 开始生成</button>
  </div>

  <!-- 中央预览 -->
  <div class="center-panel" id="center">
    <div class="preview-empty" id="preview-empty">
      <div class="icon">&#9678;</div>
      <p>输入描述，点击生成按钮</p>
    </div>
    <div class="status-toast hidden" id="status-toast"></div>
    <div class="preview-container hidden" id="preview-container">
      <img id="preview-image" src="" alt="预览">
      <div class="anim-bar hidden" id="anim-bar">
        <button id="anim-prev" title="上一帧">&#9664;</button>
        <button id="anim-play" title="播放/暂停">&#9654;</button>
        <button id="anim-next" title="下一帧">&#9654;</button>
        <div class="divider"></div>
        <input type="range" id="fps-slider" min="2" max="30" value="12">
        <span class="fps" id="fps-display">12fps</span>
      </div>
    </div>
  </div>

  <!-- 右侧资产列表 -->
  <div class="right-panel">
    <div class="right-header">
      <h3>会话资产</h3>
      <button class="btn btn-sm btn-outline hidden" id="download-all-btn">打包下载</button>
    </div>
    <div id="asset-list"><div class="empty-state">暂无资产，开始生成吧</div></div>
  </div>
</div>
<div class="toast-popup hidden" id="toast"></div>

<script>
let sessionId = null;
let currentType = 'character';
let assets = [];
let animTimer = null;
let animPlaying = false;
let animFps = 12;
let frameUrls = [];
let frameIdx = 0;

const API = {
  async init() { const r = await fetch('/api/session', {method:'POST'}); const d = await r.json(); sessionId = d.session_id; },
  async uploadStyleRef(file) { const fd = new FormData(); fd.append('session_id',sessionId); fd.append('file',file); await fetch('/api/style-ref',{method:'POST',body:fd}); },
  async generate(p) {
    const fd = new FormData();
    for (const [k,v] of Object.entries({session_id:sessionId,asset_type:p.type,description:p.desc,style_keywords:'pixel art, game asset',size:p.size,frames:p.frames,view:p.view,grid_size:p.grid,use_ai_rewrite:p.rewrite,animation_mode:'t2v'}))
      fd.append(k, String(v));
    const r = await fetch('/api/generate',{method:'POST',body:fd}); return await r.json();
  },
  async getJob(jid) { const r = await fetch('/api/generate/'+jid); return await r.json(); },
  async getAssets() { const r = await fetch('/api/session/assets?session_id='+sessionId); return await r.json(); },
  async getPresets() { const r = await fetch('/api/presets'); return await r.json(); },
};

async function init() {
  await API.init();
  const presets = await API.getPresets();
  const sel = document.getElementById('preset-select');
  const labels = {character:'角色', tilemap:'场景', ui:'UI', props:'道具', vfx:'特效'};
  for (const [type, items] of Object.entries(presets)) {
    const g = document.createElement('optgroup');
    g.label = labels[type] || type;
    for (const item of items) {
      const o = document.createElement('option');
      o.value = JSON.stringify({type, ...item});
      o.textContent = item.label;
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
}

// 类型切换
document.getElementById('type-grid').addEventListener('click', e => {
  const btn = e.target.closest('.type-btn');
  if (!btn) return;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentType = btn.dataset.type;
  document.getElementById('preset-select').value = '';
});

// 预设选择
document.getElementById('preset-select').addEventListener('change', e => {
  if (!e.target.value) return;
  const p = JSON.parse(e.target.value);
  currentType = p.type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === p.type));
  document.getElementById('desc-input').value = p.description || '';
  if (p.view) document.getElementById('view-input').value = p.view;
  if (p.frames) document.getElementById('frames-input').value = p.frames;
  if (p.grid_size) document.getElementById('grid-input').value = p.grid_size;
});

// 生成按钮
document.getElementById('generate-btn').addEventListener('click', async () => {
  const desc = document.getElementById('desc-input').value.trim();
  if (!desc) { showToast('请先输入描述'); return; }

  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  btn.innerHTML = '&#9693; 生成中...';
  showStatus('正在生成...', 'generating');

  try {
    const genResp = await API.generate({
      type: currentType,
      desc: desc,
      size: document.getElementById('size-input').value,
      frames: parseInt(document.getElementById('frames-input').value)||1,
      view: document.getElementById('view-input').value,
      grid: parseInt(document.getElementById('grid-input').value)||32,
      rewrite: document.getElementById('ai-rewrite-check').checked,
    });

    const jid = genResp.job_id;
    const poll = async () => {
      const st = await API.getJob(jid);
      if (st.status === 'done') {
        showResult(st.image_base64, st.json_metadata);
        showStatus('生成完成!', 'done');
        btn.disabled = false;
        btn.innerHTML = '&#9654; 开始生成';
        await refreshAssets();
        setTimeout(() => hideStatus(), 3000);
      } else if (st.status === 'failed') {
        showStatus('失败: ' + (st.error||'未知错误'), 'error');
        btn.disabled = false;
        btn.innerHTML = '&#9654; 重试';
      } else {
        setTimeout(poll, 2000);
      }
    };
    setTimeout(poll, 2000);
  } catch (err) {
    showStatus('错误: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '&#9654; 开始生成';
  }
});

document.getElementById('style-ref-input').addEventListener('change', async e => {
  if (e.target.files[0]) await API.uploadStyleRef(e.target.files[0]);
});

// 预览 & 动画
function showResult(b64, metaStr) {
  document.getElementById('preview-empty').classList.add('hidden');
  document.getElementById('preview-container').classList.remove('hidden');
  stopAnim();

  const img = document.getElementById('preview-image');
  img.src = b64 ? 'data:image/png;base64,' + b64 : '';

  const bar = document.getElementById('anim-bar');
  if (metaStr) {
    try {
      const m = JSON.parse(metaStr);
      if (m.frames && m.frames.length > 1) {
        parseFrames(b64, m.frames);
        bar.classList.remove('hidden');
      } else {
        bar.classList.add('hidden');
      }
    } catch(_) { bar.classList.add('hidden'); }
  }
}

function parseFrames(sheetB64, metas) {
  frameUrls = []; frameIdx = 0;
  const src = 'data:image/png;base64,' + sheetB64;
  const imgEl = new Image();
  imgEl.onload = () => {
    const cvs = document.createElement('canvas');
    for (const m of metas) {
      const r = m.rect;
      cvs.width = r.w; cvs.height = r.h;
      const ctx = cvs.getContext('2d');
      ctx.drawImage(imgEl, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      frameUrls.push(cvs.toDataURL('image/png'));
    }
    showFrame(0);
  };
  imgEl.src = src;
}

function showFrame(i) {
  if (i < 0 || i >= frameUrls.length) return;
  frameIdx = i;
  document.getElementById('preview-image').src = frameUrls[i];
}

function stopAnim() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  animPlaying = false;
  document.getElementById('anim-play').innerHTML = '&#9654;';
}

document.getElementById('anim-play').addEventListener('click', function() {
  if (animPlaying) { stopAnim(); return; }
  animPlaying = true;
  this.innerHTML = '&#9646;&#9646;';
  animTimer = setInterval(() => showFrame((frameIdx+1)%frameUrls.length), 1000/animFps);
});
document.getElementById('anim-prev').addEventListener('click', () => { stopAnim(); showFrame((frameIdx-1+frameUrls.length)%frameUrls.length); });
document.getElementById('anim-next').addEventListener('click', () => { stopAnim(); showFrame((frameIdx+1)%frameUrls.length); });
document.getElementById('fps-slider').addEventListener('input', function() {
  animFps = parseInt(this.value);
  document.getElementById('fps-display').textContent = animFps+'fps';
  if (animPlaying) { clearInterval(animTimer); animTimer = setInterval(() => showFrame((frameIdx+1)%frameUrls.length), 1000/animFps); }
});

// 状态提示
function showStatus(msg, cls) {
  const el = document.getElementById('status-toast');
  el.textContent = msg;
  el.className = 'status-toast ' + cls;
  el.classList.remove('hidden');
}
function hideStatus() { document.getElementById('status-toast').classList.add('hidden'); }

// 资产列表
async function refreshAssets() {
  const data = await API.getAssets();
  assets = data.assets || [];
  renderAssets();
  document.getElementById('download-all-btn').classList.toggle('hidden', assets.length === 0);
}

function renderAssets() {
  const list = document.getElementById('asset-list');
  if (assets.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无资产，开始生成吧</div>';
    return;
  }
  const labels = {character:'角色', tilemap:'场景', ui:'UI', props:'道具', vfx:'特效'};
  list.innerHTML = assets.map(a =>
    '<div class="asset-card">' +
      '<div class="card-header">' +
        '<span class="type-tag tag-' + a.asset_type + '">' + (labels[a.asset_type]||a.asset_type) + '</span>' +
        (a.cached ? '<span class="cache-tag">缓存</span>' : '') +
      '</div>' +
      '<div class="desc-text">' + a.description + '</div>' +
      '<div class="meta">' + a.frame_count + ' 帧</div>' +
      '<div class="card-actions">' +
        '<button class="btn btn-sm btn-outline pv-btn" data-jid="' + a.job_id + '">预览</button>' +
        '<button class="btn btn-sm btn-outline dl-btn" data-jid="' + a.job_id + '">下载</button>' +
      '</div>' +
    '</div>'
  ).join('');

  list.querySelectorAll('.dl-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); window.open('/api/download/'+btn.dataset.jid, '_blank'); });
  });
  list.querySelectorAll('.pv-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const st = await API.getJob(btn.dataset.jid);
      if (st.status === 'done' && st.image_base64) showResult(st.image_base64, st.json_metadata);
    });
  });
}

document.getElementById('download-all-btn').addEventListener('click', () => {
  const fd = new FormData();
  fd.append('session_id', sessionId);
  fetch('/api/session/download-all', {method:'POST', body:fd})
    .then(r => r.blob()).then(blob => {
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u; a.download = '全部素材.zip'; a.click();
      URL.revokeObjectURL(u);
    });
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

init();
</script>
</body>
</html>
